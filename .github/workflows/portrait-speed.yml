name: Compare portrait latency
on:
  push:
    branches: [legacycon-2026]
    paths: ['.github/workflows/portrait-speed.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node tests/portrait-speed.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: portrait-speed
          path: artifacts/
