name: Verify original outfit preservation
on:
  push:
    branches: [legacycon-2026]
    paths: [.github/workflows/clothing-live.yml]
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node tests/clothing-live.mjs
        env:
          KIOSK_URL: https://rpb-legacycon-kiosk-882fj5ok9-powerwyzes-projects.vercel.app
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: clothing-live
          path: artifacts/
