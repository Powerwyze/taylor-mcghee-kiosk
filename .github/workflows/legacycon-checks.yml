name: LegacyCon kiosk2 photo booth remote checks
on:
  push:
    branches: [legacycon-kiosk2-photo-booth]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts
      - run: node --test tests/*.test.cjs
      - run: node --check public/app.js && node --check public/blueprint-voice.js && node --check api/expanded-photo.js
      - run: npm install --no-save --package-lock=false playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: node tests/kiosk-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: legacycon-browser
          path: artifacts/
