name: Render legal memory cards
on:
  push:
    branches: [legacycon-2026]
    paths: [scripts/create-legal-cards.py, .github/workflows/legal-card-assets.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: legacycon-2026
      - run: sudo apt-get update -qq && sudo apt-get install -y blender
      - run: blender --background --python-exit-code 1 --python scripts/create-legal-cards.py
      - name: Save rendered artwork
        run: |
          git config user.name 'PowerWyze build'
          git config user.email 'actions@users.noreply.github.com'
          git add public/assets/legal-cards
          git commit -m "Render high-definition legal memory artwork"
          git pull --rebase origin legacycon-2026
          git push origin HEAD:legacycon-2026
      - uses: actions/upload-artifact@v4
        with:
          name: legal-card-art
          path: public/assets/legal-cards/
