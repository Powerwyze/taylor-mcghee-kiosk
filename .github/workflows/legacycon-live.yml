name: LegacyCon kiosk2 live verification
on:
  workflow_dispatch:
    inputs:
      base_url:
        description: Kiosk deployment URL to verify
        required: false
        type: string
jobs:
  voice:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm install --no-save --package-lock=false playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: node tests/kiosk2-voice-smoke.mjs
  photo:
    runs-on: ubuntu-latest
    env:
      KIOSK_BASE_URL: ${{ inputs.base_url }}
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm install --no-save --package-lock=false playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: node tests/kiosk2-photo-live.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kiosk2-live-photo
          path: artifacts/live-*
