name: LegacyCon live verification
on:
  push:
    branches: [legacycon-2026]
    paths: ['.github/workflows/legacycon-live.yml']
  workflow_dispatch:
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm install --no-save playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: node tests/live-headshot.mjs
        env:
          KIOSK_URL: https://rpb-legacycon-kiosk-9h13witpn-powerwyzes-projects.vercel.app
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: legacycon-live
          path: artifacts/