name: Verify LegacyCon production
on:
  workflow_dispatch:
    inputs:
      kiosk_url:
        description: Public kiosk or preview URL to inspect
        default: https://rpb-legacycon-kiosk.vercel.app
        required: true
      skip_provider_checks:
        description: Skip unchanged paid provider paths for visual-only updates
        default: 'true'
        required: true
jobs:
  production:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm install --no-save playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: node tests/production-browser.mjs
        env:
          KIOSK_URL: ${{ inputs.kiosk_url }}
          SKIP_PROVIDER_CHECKS: ${{ inputs.skip_provider_checks }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: legacycon-production
          path: artifacts/
