name: Verify LegacyCon production
on:
  push:
    branches: [legacycon-2026]
    paths: ['.github/workflows/legacycon-production-check.yml']
  workflow_dispatch:
jobs:
  production:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm install --no-save playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: node tests/production-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: legacycon-production
          path: artifacts/
