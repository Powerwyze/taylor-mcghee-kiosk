name: Verify sentry welcome
on:
  workflow_dispatch:
    inputs:
      kiosk_url:
        required: true
        description: Preview URL for live voice and camera greeting checks
jobs:
  sentry:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm install --no-save --package-lock=false playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: node tests/sentry-live.mjs
        env:
          KIOSK_URL: ${{ inputs.kiosk_url }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sentry-live
          path: artifacts/
